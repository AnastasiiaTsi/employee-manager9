[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-manager"
version = "0.9.0"
description = "Employee management application with performance optimizations"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio",
]

[project.scripts]
employee-manager = "employee_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"